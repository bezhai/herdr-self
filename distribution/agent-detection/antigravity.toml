id = "agy"
version = "2026.10.01.1"
min_engine_version = 1
updated_at = "2026-10-01T00:00:00Z"
aliases = ["antigravity", "antigravity-cli"]

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
contains = ["requesting permission for:"]
any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["tab amend", "edit command"] },
]

[[rules]]
id = "approval_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(16)"
visible_blocker = true
contains = ["esc to cancel"]
line_regex = ['^\W*1\.\s+Yes,', '^\W*[2-9]\.\s+No,']

[[rules]]
id = "question_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(24)"
visible_blocker = true
contains = ["esc to cancel"]
line_regex = ['^\s*Question\s+[0-9]+/[0-9]+:']

[[rules]]
id = "workspace_trust_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(12)"
visible_blocker = true
contains = ["do you trust the contents of this project?", "no, exit"]

[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
line_regex = ['^\s*[\u2800-\u28FF]+\s+\p{Alphabetic}+\w*ing\b']

[[rules]]
id = "background_tasks_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)·\s*[1-9][0-9]*\s+task']
